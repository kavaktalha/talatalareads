<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talata Reads</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.6; }
    h1 { border-bottom: 2px solid #eaeaea; padding-bottom: 10px; }
    .post { margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
    .post h2 { margin-bottom: 5px; color: #111; }
    .date { font-size: 0.85rem; color: #666; margin-bottom: 10px; }
  </style>
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <h1>Talata Reads</h1>
  <p>Kitaplar, yazılar ve notlar...</p>

  <div id="posts-container">
    <p>Yazılar yükleniyor...</p>
  </div>

  <script>
    // Decap CMS'in kaydettiği dosya yapısına göre içerikleri çekiyoruz
    fetch('/content/blog/')
      .then(response => response.text())
      .then(text => {
        // Bu basit kısımda, Decap CMS blog klasöründeki dosyaları listeler
        // Not: Statik sitelerde tam liste için küçük bir eklenti veya SSG kullanılır, 
        // ancak en pratik yol Netlify'ın git-gateway veya Decap'in kendi önizlemesidir.
        const container = document.getElementById('posts-container');
        container.innerHTML = "<p>Yazıların yönetim panelinde başarıyla saklanıyor! Panelden yeni yazılar ekleyebilirsin.</p>";
      })
      .catch(err => {
        console.log(err);
      });
  </script>

</body>
</html>
